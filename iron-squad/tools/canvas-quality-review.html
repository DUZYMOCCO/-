<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IRON SQUAD 描画確認</title>
<link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/game-ui.css"><link rel="stylesheet" href="../css/iron-squad.css"><link rel="stylesheet" href="../css/iron-squad-interface.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#game{display:block;width:100%;height:100dvh}.game-container{height:100dvh!important}</style></head>
<body><div id="game" class="game-container"></div>
<script type="module">
// A disposable playtest save. This page never reads or writes the user's slots.
const memory=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:key=>memory.get(key)??null,setItem:(key,value)=>memory.set(key,String(value)),removeItem:key=>memory.delete(key)}});
const {IronSquadGame}=await import('../js/index.js');
const game=Object.create(IronSquadGame);game.init(document.getElementById('game'),()=>{});window.qualityGame=game;
document.querySelector('#new-expedition-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));
document.querySelector('#btn-commander-confirm').click(); // v4.2.24: 隊長づくりは何も選ばずに出発
window.qualityReady=true;
</script></body></html>
