<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スマホゲーム工房</title>

  <!-- iOS / iPhone PWA 最適化メタタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ゲーム工房">
  <meta name="theme-color" content="#0b0d14">
  <meta name="format-detection" content="telephone=no">

  <!-- アイコン設定 -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- スタイルシート (キャッシュバスター付与) -->
  <link rel="stylesheet" href="css/style.css?v=10">
  <link rel="stylesheet" href="css/game-ui.css?v=10">

  <!-- グローバルエラートラップ（真っ暗な画面でのフリーズを絶対防止） -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('Global Error caught:', e);
      var rescue = document.getElementById('rescue-banner');
      if (rescue) rescue.style.display = 'block';
    });
  </script>
</head>
<body>
  <!-- 緊急レスキューバナー (JSエラーやキャッシュ不整合時に表示) -->
  <div id="rescue-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999; background:#ef4444; color:#fff; padding:12px; font-size:12px; text-align:center;">
    ⚠️ 画面の読み込みで問題が発生しました。
    <button onclick="if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});location.reload(true);});});}else{location.reload(true);}" style="margin-left:8px; padding:4px 10px; background:#fff; color:#ef4444; border:none; border-radius:4px; font-weight:bold;">
      キャッシュを消して更新
    </button>
  </div>

  <div id="app">
    <!-- 工房ポータル (Hub) -->
    <main id="studio-hub" class="studio-hub">
      <header class="studio-header">
        <div class="header-title-group">
          <h1>スマホゲーム工房</h1>
          <span class="header-subtitle">FOR MY iPHONE ONLY</span>
        </div>
        <div class="hub-controls">
          <button id="btn-sound-toggle" class="control-btn" title="サウンド切り替え">🔊</button>
        </div>
      </header>

      <!-- iPhone Safari向け PWAホーム画面追加案内 -->
      <div id="pwa-install-banner" class="pwa-banner hidden">
        <div class="pwa-banner-content">
          <span class="pwa-banner-icon">📲</span>
          <div class="pwa-banner-text">
            <strong>ホーム画面に追加して全画面プレイ！</strong>
            <p>下部の [共有 ⎋] ➔ [ホーム画面に追加 ＋] でアプリ化できます</p>
          </div>
        </div>
        <button id="btn-close-pwa" class="banner-close-btn">✕</button>
      </div>

      <div class="hub-content">
        <div class="section-label">SELECT GAME</div>
        <div id="games-grid" class="games-grid">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <footer class="hub-footer">
        <p>📱 スマホゲーム工房 v1.2.1</p>
        <p style="margin-top: 6px;">
          <button id="btn-force-refresh" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#94a3b8; font-size:11px; padding:5px 12px; border-radius:12px; cursor:pointer;">
            🔄 最新データに更新
          </button>
        </p>
        <p style="margin-top: 6px; opacity: 0.6; font-size: 10px;">Designed exclusively for iPhone</p>
      </footer>
    </main>

    <!-- ゲーム実行画面コンテナ -->
    <div id="game-container" class="game-container hidden"></div>
  </div>

  <!-- スクリプト (キャッシュバスター付与) -->
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
