<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スマホゲーム工房</title>

  <!-- iOS / iPhone PWA 最適化メタタグ -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ゲーム工房">
  <meta name="theme-color" content="#0b0d14">
  <meta name="format-detection" content="telephone=no">

  <!-- アイコン設定 -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- スタイルシート (キャッシュバスター付与) -->
  <link rel="stylesheet" href="css/style.css?v=165">
  <link rel="stylesheet" href="css/game-ui.css?v=165">
  <link rel="stylesheet" href="css/iron-squad.css?v=165">
  <link rel="stylesheet" href="css/iron-squad-interface.css?v=165">

  <!-- グローバルエラートラップ（初期ロード失敗時の画面真っ暗詰みのみ救済） -->
  <script>
    window.__studio_loaded = false;
    window.addEventListener('error', function(e) {
      console.error('Global Error caught:', e);
      // アプリ起動完了後はゲームプレイを妨げないようバナーは非表示（コンソール出力のみ）
      if (window.__studio_loaded) return;
      var msg = (e && e.message) ? e.message.toLowerCase() : '';
      if (msg.includes('resizeobserver') || msg.includes('script error') || msg.includes('abort')) return;
      var rescue = document.getElementById('rescue-banner');
      if (rescue) rescue.style.display = 'block';
    });

    // PWAキャッシュ完全消去＆強制最新リロード関数（非同期完了待ち・URLキャッシュ貫通）
    window.forcePwaUpdate = function() {
      var btn = (window.event && window.event.target) || document.getElementById('btn-force-refresh');
      if (btn) btn.textContent = '⏳ 更新中...';
      var cleanup = Promise.resolve();
      if ('serviceWorker' in navigator) {
        cleanup = cleanup.then(function() {
          return navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) { return r.unregister(); }));
          });
        });
      }
      if ('caches' in window) {
        cleanup = cleanup.then(function() {
          return caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          });
        });
      }
      cleanup.then(function() {
        var base = window.location.origin + window.location.pathname;
        window.location.replace(base + '?_bust=' + Date.now());
      }).catch(function() {
        window.location.replace(window.location.pathname + '?_bust=' + Date.now());
      });
    };
  </script>
</head>
<body>
  <!-- 緊急レスキューモーダル (初期起動失敗時のみ表示・iPhone上部操作と一切干渉しない画面中央配置) -->
  <div id="rescue-banner" style="display:none; position:fixed; inset:0; z-index:99999; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);">
    <div style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#1e2430; border:2px solid #ef4444; border-radius:16px; padding:22px 18px; width:calc(100% - 48px); max-width:320px; box-shadow:0 12px 36px rgba(0,0,0,0.85); text-align:center; color:#fff;">
      <div style="font-size:32px; margin-bottom:8px;">⚠️</div>
      <div style="font-size:14px; font-weight:bold; margin-bottom:6px;">画面の読み込みで問題が発生しました</div>
      <div style="font-size:11px; color:#94a3b8; line-height:1.5; margin-bottom:16px;">古いキャッシュが残っている可能性があります。下のボタンを押して最新版に更新してください。</div>
      <button onclick="window.forcePwaUpdate()" style="display:block; width:100%; min-height:46px; padding:12px; background:linear-gradient(135deg, #ef4444, #dc2626); color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:14px; cursor:pointer; box-shadow:0 4px 14px rgba(239,68,68,0.45);">
        🔄 キャッシュを消して更新
      </button>
      <button onclick="document.getElementById('rescue-banner').style.display='none';" style="margin-top:10px; padding:8px 16px; background:transparent; color:#94a3b8; border:none; font-size:12px; cursor:pointer;">
        ✕ 閉じる
      </button>
    </div>
  </div>

  <div id="app">
    <!-- 工房ポータル (Hub) -->
    <main id="studio-hub" class="studio-hub">
      <header class="studio-header">
        <div class="header-title-group">
          <h1>スマホゲーム工房</h1>
          <span class="header-subtitle">FOR MY iPHONE ONLY</span>
        </div>
        <div class="hub-controls">
          <button id="btn-kana-mode" class="control-btn" title="ひらがなモード" aria-pressed="false">あ</button>
          <button id="btn-sound-toggle" class="control-btn" title="サウンド切り替え">🔊</button>
        </div>
      </header>

      <!-- iPhone Safari向け PWAホーム画面追加案内 -->
      <div id="pwa-install-banner" class="pwa-banner hidden">
        <div class="pwa-banner-content">
          <span class="pwa-banner-icon">📲</span>
          <div class="pwa-banner-text">
            <strong>ホーム画面に追加して全画面プレイ！</strong>
            <p>下部の [共有 ⎋] ➔ [ホーム画面に追加 ＋] でアプリ化できます</p>
          </div>
        </div>
        <button id="btn-close-pwa" class="banner-close-btn">✕</button>
      </div>

      <div class="hub-content">
        <div class="section-label">IRON SQUAD · 雑兵立身出世録</div>
        <div id="games-grid" class="games-grid">
          <!-- JSで動的生成 -->
        </div>
      </div>

      <footer class="hub-footer">
        <p>📱 スマホゲーム工房 v4.2.18</p>
        <p style="margin-top: 6px;">
          <button id="btn-force-refresh" onclick="window.forcePwaUpdate()" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#94a3b8; font-size:11px; padding:6px 14px; border-radius:12px; cursor:pointer;">
            🔄 最新データに更新
          </button>
        </p>
        <p style="margin-top: 6px; opacity: 0.6; font-size: 10px;">Designed exclusively for iPhone</p>
      </footer>
    </main>

    <!-- ゲーム実行画面コンテナ -->
    <div id="game-container" class="game-container hidden"></div>
  </div>

  <!-- スクリプト (キャッシュバスター付与) -->
  <script type="module" src="js/app.js?v=165"></script>
</body>
</html>
